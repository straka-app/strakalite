<style>
/* ============ TOKENS ============ */
:root{
--bg:#ECF0E6; --paper:#FBFCF8; --ink:#132A21; --mut:#5C6E63;
--pine:#0E3B2E; --pine2:#0A2A21; --pine3:#15543F;
--line:rgba(19,42,33,.15); --line2:rgba(19,42,33,.08);
--gold:#EFA51C; --gold2:#D98E0F; --gold-ink:#7A4E00; --amber-bg:#FBF1DA;
--ok:#1F8A5B; --ok-bg:#E2F1E7; --red:#BF4229; --red-bg:#F7E5E0;
--teal:#0F766E; --teal-bg:#DFF0EE; --slate:#5B6B62; --slate-bg:#ECEFEA;
--ring-track:rgba(19,42,33,.1); --ring-tick:rgba(19,42,33,.22);
--disp:'Bricolage Grotesque',system-ui,sans-serif;
--body:'Instrument Sans',system-ui,sans-serif;
--mono:'IBM Plex Mono',ui-monospace,monospace;
--r-lg:16px; --r-md:12px; --r-sm:9px;
--sh:0 1px 2px rgba(13,37,29,.05),0 10px 28px -18px rgba(13,37,29,.22);
--sh2:0 2px 6px rgba(13,37,29,.08),0 26px 52px -26px rgba(13,37,29,.35);
--ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"]{
--bg:#0E1A15; --paper:#14231D; --ink:#EAF2EC; --mut:#9FB8A9;
--pine:#1F5C46; --pine2:#0F2E23; --pine3:#2A7A5C;
--line:rgba(234,242,236,.15); --line2:rgba(234,242,236,.08);
--gold:#F7C766; --gold2:#EFA51C; --gold-ink:#F7C766; --amber-bg:rgba(239,165,28,.12);
--ok:#3FBF82; --ok-bg:rgba(31,138,91,.2); --red:#E57A5F; --red-bg:rgba(191,66,41,.18);
--teal:#2AA39A; --teal-bg:rgba(15,118,110,.2); --slate:#8BA097; --slate-bg:rgba(91,107,98,.2);
--ring-track:rgba(234,242,236,.12); --ring-tick:rgba(234,242,236,.22);
}

/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.5;
background:
radial-gradient(1100px 480px at 88% -120px, rgba(239,165,28,.10), transparent 60%),
linear-gradient(rgba(14,59,46,.045) 1px, transparent 1px),
linear-gradient(90deg, rgba(14,59,46,.045) 1px, transparent 1px),
var(--bg);
background-size:auto,34px 34px,34px 34px,auto;
min-height:100vh;-webkit-font-smoothing:antialiased;
}
[data-theme="dark"] body{
background:
radial-gradient(1100px 480px at 88% -120px, rgba(247,199,102,.07), transparent 60%),
linear-gradient(rgba(234,242,236,.035) 1px, transparent 1px),
linear-gradient(90deg, rgba(234,242,236,.035) 1px, transparent 1px),
var(--bg);
background-size:auto,34px 34px,34px 34px,auto;
}
::selection{background:var(--gold);color:#221703}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.disp{font-family:var(--disp);letter-spacing:-.02em}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg{display:inline-block;vertical-align:middle}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ LOADER ============ */
#loader{
position:fixed;inset:0;z-index:9999;
background:radial-gradient(800px 400px at 50% 20%, rgba(239,165,28,.16), transparent 60%),
linear-gradient(135deg,#0A2A21 0%,#0E3B2E 62%,#155844 100%);
display:flex;flex-direction:column;align-items:center;justify-content:center;
color:#F2F6EF;transition:opacity .6s ease,visibility .6s ease;
}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-rings{position:relative;width:140px;height:140px;margin-bottom:30px}
.loader-rings svg{width:100%;height:100%;animation:spinSlow 14s linear infinite}
.loader-rings .pulse{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.loader-rings .pulse::before{content:"";width:26px;height:26px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(239,165,28,.6);animation:loaderPulse 1.8s infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes loaderPulse{0%{box-shadow:0 0 0 0 rgba(239,165,28,.6)}70%{box-shadow:0 0 0 22px rgba(239,165,28,0)}100%{box-shadow:0 0 0 0 rgba(239,165,28,0)}}
.loader-brand{font-family:var(--disp);font-weight:800;font-size:32px;letter-spacing:-.03em}
.loader-sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#BFD4C6;margin:6px 0 28px}
.loader-status{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:#C9D8CC}
.loader-status .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:loaderPulse 1.6s infinite}
.loader-bar{width:220px;height:3px;background:rgba(245,248,241,.14);border-radius:99px;overflow:hidden;margin-top:18px}
.loader-bar i{display:block;height:100%;width:30%;background:var(--gold);border-radius:99px;animation:loaderSlide 1.6s ease-in-out infinite}
@keyframes loaderSlide{0%{transform:translateX(-100%)}50%{transform:translateX(200%)}100%{transform:translateX(400%)}}

/* ============ TOPBAR ============ */
.topbar{position:sticky;top:0;z-index:60;background:rgba(251,252,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme="dark"] .topbar{background:rgba(20,35,29,.88)}
.topbar .wrap{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.brand[aria-disabled="true"]{cursor:default}
.brand b{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;display:block;margin-top:-3px}
.tbRight{margin-left:auto;display:flex;align-items:center;gap:10px}
.syncBadge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);padding:7px 12px;border-radius:999px;background:var(--paper)}
.syncBadge .dot{width:7px;height:7px;border-radius:50%;flex:none}
.syncBadge .dot.online{background:var(--ok);animation:pulse 1.6s infinite}
.syncBadge .dot.connecting{background:var(--gold);animation:pulse 1.2s infinite}
.syncBadge .dot.offline{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,91,.5)}70%{box-shadow:0 0 0 8px rgba(31,138,91,0)}100%{box-shadow:0 0 0 0 rgba(31,138,91,0)}}
.iconBtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;color:var(--pine);transition:.18s;position:relative}
.iconBtn:hover{background:var(--pine);color:#EAF2EC;transform:translateY(-1px)}
.iconBtn svg{width:17px;height:17px}
.iconBtn.xs{width:34px;height:34px;border-radius:8px}
.iconBtn.xs svg{width:13px;height:13px}
.chatBadge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#221703;font:700 9px var(--mono);min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ============ TABS ============ */
.tabs{max-width:1180px;margin:0 auto;padding:22px 24px 0;overflow-x:auto}
.tabbar{display:inline-flex;align-items:center;gap:4px;border-radius:12px;border:1px solid var(--line);padding:5px;background:var(--paper);box-shadow:var(--sh)}
.tab-btn{border-radius:8px;padding:9px 18px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:none;background:transparent;color:var(--mut);transition:.18s;white-space:nowrap}
.tab-btn:hover{color:var(--pine)}
.tab-btn.active{background:var(--pine);color:#F3F7EF;box-shadow:0 4px 12px -5px rgba(14,59,46,.5)}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 13px var(--body);padding:10px 16px;border-radius:var(--r-sm);border:1px solid transparent;transition:.18s;letter-spacing:.01em;text-decoration:none;white-space:nowrap;cursor:pointer}
.btn:active{transform:translateY(1px) scale(.99)}
.btn svg{width:15px;height:15px;flex:none}
.btn-pine{background:var(--pine);color:#F3F7EF}
.btn-pine:hover{background:var(--pine3);box-shadow:0 10px 22px -10px rgba(14,59,46,.55)}
.btn-gold{background:var(--gold);color:#221703}
.btn-gold:hover{background:var(--gold2);box-shadow:0 10px 22px -10px rgba(239,165,28,.6)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:rgba(14,59,46,.07);border-color:var(--pine)}
[data-theme="dark"] .btn-ghost:hover{background:rgba(234,242,236,.06)}
.btn-danger{background:transparent;border-color:rgba(191,66,41,.4);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-danger-solid{background:var(--red);color:#fff}
.btn-danger-solid:hover{filter:brightness(.92);box-shadow:0 10px 22px -10px rgba(191,66,41,.5)}
.btn-sm{padding:8px 13px;font-size:12px;border-radius:8px}
.btn-xs{padding:6px 11px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ LAYOUT ============ */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
main{padding:22px 0 60px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.secIdx{font:600 12px var(--mono);color:var(--gold2);letter-spacing:.12em}
[data-theme="dark"] .secIdx{color:var(--gold)}
.section-head h2{font-family:var(--disp);font-weight:800;font-size:clamp(1.4rem,2.6vw,1.9rem);letter-spacing:-.02em}
.secCount{font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.spacer{flex:1}

/* ============ CARDS ============ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.card-hover:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:rgba(14,59,46,.32)}
[data-theme="dark"] .card-hover:hover{border-color:rgba(234,242,236,.25)}
.card-body{padding:18px}
.card-section{padding:22px}
.card-section + .card-section{border-top:1px solid var(--line2)}

/* ============ INPUTS ============ */
.input{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;font-size:14px;outline:none;transition:.16s}
[data-theme="dark"] .input{background:var(--paper)}
.input:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,59,46,.12)}
[data-theme="dark"] .input:focus{box-shadow:0 0 0 3px rgba(234,242,236,.1)}
.input::placeholder{color:var(--mut);opacity:.7}
.select{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;font-size:13px;outline:none;cursor:pointer}
[data-theme="dark"] .select{background:var(--paper)}
.select:focus{border-color:var(--pine)}
.searchBox{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 13px;transition:.18s;position:relative}
.searchBox:focus-within{border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,59,46,.1)}
[data-theme="dark"] .searchBox:focus-within{box-shadow:0 0 0 3px rgba(234,242,236,.08)}
.searchBox svg{width:15px;height:15px;opacity:.55}
.searchBox input{border:none;outline:none;background:none;width:100%;padding-left:6px;padding-right:30px}
.clearBtn{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;border-radius:6px}
.clearBtn:hover{color:var(--red)}
.clearBtn svg{width:12px;height:12px}
.seg{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg-btn{flex:1;border:none;background:transparent;border-radius:7px;padding:8px 10px;font:600 12px var(--body);color:var(--mut);transition:.15s}
.seg-btn:hover{color:var(--pine)}
.seg-btn.active{background:var(--pine);color:#F3F7EF}

/* ============ TAGS ============ */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--paper);color:var(--mut)}
.tag-solid{background:var(--pine);color:#F3F7EF;border-color:var(--pine)}
.tag-gold{background:var(--gold);color:#221703;border-color:var(--gold)}
.tag-success{background:var(--ok);color:#fff;border-color:var(--ok)}
.tag-done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag-next{background:var(--gold);color:#221703;border-color:var(--gold)}
.tag-upcoming{background:var(--paper);color:var(--mut);border-color:var(--line)}
.tag-danger{background:var(--red-bg);color:var(--red);border-color:transparent}
.tag-btn{cursor:pointer;font-family:inherit;transition:.15s}
.tag-btn:hover{border-color:var(--pine);color:var(--pine)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* ============ PROGRESS / RING ============ */
.progress-track{width:100%;height:8px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:var(--pine);transition:width .8s var(--ease)}
.ring-wrap{position:relative;display:flex;flex-direction:column;align-items:center;flex:none}
.ring-wrap svg{display:block}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-pct{font:600 22px var(--mono);letter-spacing:-.04em;color:var(--pine)}
[data-theme="dark"] .ring-pct{color:var(--ink)}
.ring-sub{margin-top:2px;font:500 10.5px var(--mono);color:var(--mut)}

/* ============ TIMELINE ============ */
.timeline{position:relative}
.tl-line{position:absolute;left:16px;top:16px;bottom:16px;width:2px;background:var(--line2);z-index:1}
.timeline-item{display:flex;gap:14px;padding:7px 0;position:relative}
.timeline-dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;color:var(--mut);font:600 11px var(--mono);transition:.2s}
.timeline-dot.done{background:var(--pine);border-color:var(--pine);color:#EAF2EC}
.timeline-dot.next{background:var(--gold);border-color:var(--gold);color:#221703;box-shadow:0 0 0 5px var(--amber-bg)}
.timeline-dot svg{width:14px;height:14px;stroke-width:3;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.timeline-card{flex:1;min-width:0;border-radius:11px;border:1px solid var(--line);background:var(--paper);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.18s}
.timeline-card.next{border-color:var(--gold);background:var(--amber-bg)}
.timeline-card.done{background:#F4F7F0}
[data-theme="dark"] .timeline-card.done{background:rgba(234,242,236,.04)}
.tl-title{font-family:var(--disp);font-size:14px;font-weight:700}
.tl-sub{font-size:12px;color:var(--mut);margin-top:2px}
.tsTxt{font:500 11px var(--mono);color:var(--mut)}
.tlHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}

/* ============ CHAT ============ */
.chat-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.chat-head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.chat-body{max-height:320px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chat-body.tall{max-height:380px}
.chat-msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.45}
.chat-msg.client{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg.instructor{align-self:flex-end;background:var(--pine);color:#F2F6EF;border-bottom-right-radius:4px}
.chat-msg.system{align-self:center;background:var(--amber-bg);border:1px dashed rgba(217,142,15,.4);color:var(--gold-ink);font-size:12px;border-radius:10px}
.chat-meta{font-size:10px;opacity:.65;margin-top:4px;font-family:var(--mono)}
.chat-input{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--paper)}
.chat-request{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.chat-request .chips{margin-top:0}
.chatEmpty{text-align:center;padding:24px;color:var(--mut);font-size:12.5px}
.status-badge{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.status-active{background:var(--ok-bg);color:var(--ok);border-color:rgba(31,138,91,.25)}
.status-paused{background:var(--amber-bg);color:var(--gold-ink);border-color:rgba(217,142,15,.35)}
.status-cancelled{background:var(--red-bg);color:var(--red);border-color:rgba(191,66,41,.2)}
.status-archived{background:var(--slate-bg);color:var(--slate)}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(8,26,20,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto}
.modal{background:var(--paper);border-radius:18px;box-shadow:var(--sh2);width:100%;max-width:520px;animation:pop .3s var(--ease);overflow:hidden;border:1px solid var(--line)}
.modal.wide{max-width:680px}
.modal.sm{max-width:430px}
.modal.sm .mSub{margin-bottom:14px}
.modal header{display:flex;align-items:center;gap:12px;padding:20px 24px 0}
.modal header h3{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em;flex:1}

  <div class="loader-rings">
    <svg viewBox="0 0 140 140" fill="none">
      <circle cx="70" cy="70" r="62" stroke="rgba(245,248,241,.14)" stroke-width="1.5" stroke-dasharray="4 10"/>
      <circle cx="70" cy="70" r="50" stroke="rgba(245,248,241,.18)" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="38" stroke="rgba(239,165,28,.5)" stroke-width="2.5" stroke-dasharray="30 200" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="26" stroke="rgba(245,248,241,.12)" stroke-width="1.5" stroke-dasharray="2 6"/>
    </svg>
    <div class="pulse"></div>
  </div>
  <div class="loader-brand">Straka Lite</div>
  <div class="loader-sub">Client Tracker</div>

  <div class="loader-bar"><i></i></div>
</div>

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
// ============================
// CONFIG
// ============================
const DB_URL = 'https://straka-ef451-default-rtdb.europe-west1.firebasedatabase.app';
const DB_ENDPOINT = DB_URL + '/straka_clients.json';
const POLL_INTERVAL = 4000;

// ============================
// STATE
// ============================
const state = {
  theme: 'light',
  activeTab: 'CLIENTS',
  clients: [],
  searchQuery: '',
  selectedClientId: null,        // tracker detail (instructor)
  selectedMessageClientId: null, // messages thread (instructor)
  showClientChat: false,         // client-side chat MODAL open
  syncStatus: 'offline',
  syncError: null,
  showSettings: false,
  showAddEditModal: false,
  editingClient: null,
  draft: null,
  showShareModal: false,
  sharingClient: null,
  showRenewModal: false,
  renewingClient: null,
  renewDraft: null,
  showDeleteConfirm: null,
  showResetConfirm: false,
  showHistory: false,
  clientViewId: null,            // set ONLY from the ?c= share link at boot
  isLoading: true,
  pollTimer: null
};
let dirty = false;          // local edits awaiting a successful push
let pushInFlight = false;   // a PUT is currently running

const programs = ['Personal Training', 'Yoga', 'Boxing', 'Strength', 'Pilates'];
function ensureCustomProgram(name){ const n=(name||'').trim(); if(!n) return; if(!programs.includes(n)) programs.push(n); }
const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

// ============================
// ICONS
// ============================
const svgIcon = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  upload: svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
  sun: svgIcon('<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.8 4.8l1.4 1.4M17.8 17.8l1.4 1.4M2.5 12h2M19.5 12h2M4.8 19.2l1.4-1.4M17.8 6.2l1.4-1.4"/>'),
  moon: svgIcon('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  gear: svgIcon('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'),
  search: svgIcon('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.2-4.2"/>'),
  eye: svgIcon('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'),
  link: svgIcon('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
  plus: svgIcon('<path d="M12 5v14M5 12h14"/>'),
  back: svgIcon('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
  check: svgIcon('<path d="M20 6 9 17l-5-5"/>'),
  chat: svgIcon('<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>'),
  x: svgIcon('<path d="M18 6 6 18M6 6l12 12"/>'),
  copy: svgIcon('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  send: svgIcon('<path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/>'),
  trash: svgIcon('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>'),
  download: svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'),
  refresh: svgIcon('<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>'),
  alert: svgIcon('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>'),
  chev: svgIcon('<path d="m6 9 6 6 6-6"/>')
};

// ============================
// UTILITIES
// ============================
function escapeHtml(text) {
  if (text == null) return '';
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function generateId() {
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}
function initials(name) {
  return (name || '??').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function avaClass(name) {
  let h = 0;
  for (const ch of (name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ['a0', 'a1', 'a2', 'a3'][h % 4];
}
function clientAccent(c) {
  if (c.status === 'cancelled') return 'var(--red)';
  if (c.status === 'paused') return 'var(--gold)';
  if (c.status === 'archived') return 'var(--slate)';
  if (c.completed >= c.total) return 'var(--ok)';
  return 'var(--pine)';
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString(); }
function lastMsgTs(c) { const m = c.messages || []; return m.length ? m[m.length - 1].ts : (c.createdAt || 0); }

function normalizeClient(c) {
  if (!c || typeof c !== 'object') return null;
  const total = Math.max(1, parseInt(c.total, 10) || 1);
  const completed = Math.max(0, Math.min(parseInt(c.completed, 10) || 0, total));
  return {
    id: String(c.id || generateId()),
    name: String(c.name || 'Unnamed Client'),
    gender: ['Male', 'Female', 'Other'].includes(c.gender) ? c.gender : 'Other',
    program: String(c.program || 'General'),
    total: total,
    completed: completed,
    schedule: Array.isArray(c.schedule)
      ? c.schedule.filter(s => s && s.day && s.time).map(s => ({ day: String(s.day), time: String(s.time) }))
      : [],
    logs: Array.isArray(c.logs) ? c.logs : [],
    createdAt: typeof c.createdAt === 'number' ? c.createdAt : Date.now(),
    history: Array.isArray(c.history) ? c.history : [],
    fee: c.fee != null ? String(c.fee) : '',
    paymentStatus: c.paymentStatus || 'Unpaid',
    note: String(c.note || ''),
    clientMessage: String(c.clientMessage || ''),
    programRequest: String(c.programRequest || ''),
    status: ['active', 'paused', 'cancelled', 'archived'].includes(c.status) ? c.status : 'active',
    messages: Array.isArray(c.messages)
      ? c.messages.map(m => ({
          id: String(m.id || ''),
          from: m.from === 'instructor' ? 'instructor' : 'client',
          text: String(m.text || ''),
          ts: typeof m.ts === 'number' ? m.ts : Date.now(),
          type: String(m.type || 'message')
        })).filter(m => m.text)
      : (c.clientMessage ? [{ id: 'legacy_' + (c.id || 'c'), from: 'client', text: String(c.clientMessage), ts: Date.now(), type: 'message' }] : []),
    pausedAt: c.pausedAt || null,
    cancelledAt: c.cancelledAt || null
  };
}
function getClients() { return Array.isArray(state.clients) ? state.clients : []; }
function getClientById(id) { return getClients().find(c => c.id === id) || null; }
function getShareLink(clientId) {
  const url = new URL(window.location.href);
  url.searchParams.set('c', clientId);
  return url.toString();
}
function copyText(t) {
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  };
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(t).then(() => true).catch(() => fallback());
  }
  return Promise.resolve(fallback());
}
function showToast(message, type = 'ok') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'warn' ? I.alert : type === 'info' ? I.chat : I.check;
  el.innerHTML = `<span class="tIco">${icon}</span><span class="tMsg">${escapeHtml(message)}</span><button class="tX" aria-label="Dismiss">${I.x}</button>`;
  el.querySelector('.tX').onclick = () => el.remove();
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(16px)'; }, 2800);
  setTimeout(() => el.remove(), 3200);
}
function fetchWithTimeout(url, opts = {}, ms = 7000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
}

// ============================
// STORAGE & SYNC
// ============================
function saveLocal() {
  try { localStorage.setItem('straka_clients', JSON.stringify(getClients())); } catch (e) {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem('straka_clients');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed.map(normalizeClient).filter(Boolean);
    if (parsed && typeof parsed === 'object') return Object.values(parsed).map(normalizeClient).filter(Boolean);
  } catch (e) {}
  return null;
}
async function pushToFirebase() {
  pushInFlight = true;
  state.syncStatus = 'connecting';
  renderSyncBadge();
  try {
    await fetchWithTimeout(DB_ENDPOINT, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(getClients())
    });
    state.syncStatus = 'online';
    state.syncError = null;
    dirty = false;
  } catch (err) {
    state.syncStatus = 'offline';
    state.syncError = err.message;
  }
  pushInFlight = false;
  renderSyncBadge();
}
async function pullFromFirebase() {
  if (pushInFlight) return;
  if (dirty) { pushToFirebase(); return; } // retry pending local edits instead of clobbering
  try {
    state.syncStatus = 'connecting';
    renderSyncBadge();
    const res = await fetchWithTimeout(DB_ENDPOINT + '?_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let incoming = [];
    if (Array.isArray(data)) incoming = data.map(normalizeClient).filter(Boolean);
    else if (data && typeof data === 'object') incoming = Object.values(data).map(normalizeClient).filter(Boolean);
    if (incoming.length > 0) {
      const localJson = JSON.stringify(getClients());
      const remoteJson = JSON.stringify(incoming);
      if (localJson !== remoteJson) {
        state.clients = incoming;
        saveLocal();
        rerender();
      }
    }
    state.syncStatus = 'online';
    state.syncError = null;
  } catch (err) {
    state.syncStatus = 'offline';
    state.syncError = err.message;
  }
  renderSyncBadge();
}
function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(() => {
    if (navigator.onLine !== false) pullFromFirebase();
  }, POLL_INTERVAL);
}
function commit() {
  saveLocal();
  dirty = true;
  pushToFirebase();
  rerender();
}
async function initData() {
  state.isLoading = true;
  let loaded = false;
  const loaderText = document.getElementById('loaderText');
  try {
    const res = await fetchWithTimeout(DB_ENDPOINT + '?_t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data) {
        let incoming = [];
        if (Array.isArray(data)) incoming = data.map(normalizeClient).filter(Boolean);
        else if (typeof data === 'object') incoming = Object.values(data).map(normalizeClient).filter(Boolean);
        if (incoming.length > 0) { state.clients = incoming; saveLocal(); loaded = true; }
      }
      state.syncStatus = 'online';
      if (loaderText) loaderText.textContent = 'Synced · loading workspace…';
    }
  } catch (e) {
    state.syncStatus = 'offline';
    if (loaderText) loaderText.textContent = 'Offline · loading local cache…';
  }
  if (!loaded) {
    const local = loadLocal();
    if (local && local.length > 0) {
      state.clients = local;
    } else {
      state.clients = []; // factory reset - clean slate
      saveLocal();
      pushToFirebase().catch(() => {});
    }
  }
  // The ONLY entry into the locked client view: the ?c= share link
  try {
    const p = new URLSearchParams(location.search).get('c');
    if (p) state.clientViewId = p; // validity checked in render()
  } catch (e) {}
  state.isLoading = false;
  startPolling();
  rerender();
  setTimeout(() => {
    const loader = document.getElementById('loader');
    if (loader) {
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 700);
    }
  }, 500);
}
function getDefaultClients() {
  // Clean slate - no mock/demo data
  return [];
}

function render() {
  const app = document.getElementById('app');
  const isClient = !!state.clientViewId;
  const client = isClient ? getClientById(state.clientViewId) : null;
  let html = renderHeader();
  if (!isClient) html += renderTabs();
  html += `<main>${isClient ? (client ? renderClientView(client) : clientNotFoundHtml()) : renderTabContent()}</main>`;
  html += `<div class="footer">${isClient ? 'Straka Lite · live view' : 'Straka Lite · synced via Firebase RTDB · every ' + (POLL_INTERVAL / 1000) + 's'}</div>`;
  html += renderModals();
  app.innerHTML = html;
  renderSyncBadge();
}
function renderTabContent() {
  switch (state.activeTab) {
    case 'CLIENTS': return renderClientsTab();
    case 'TRACKER': return renderTrackerTab();
    case 'MESSAGES': return renderMessagesTab();
    case 'CONSOLE': return renderConsoleTab();
  }
  return '';
}
// Re-render while preserving input focus & caret (search, chat, forms)
function rerender() {
  const ae = document.activeElement;
  const fid = ae && ae.id ? ae.id : null;
  const pos = (ae && ae.selectionStart != null) ? ae.selectionStart : null;
  render();
  if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus();
      if (pos != null && el.setSelectionRange) { try { el.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }
  document.querySelectorAll('[data-autoscroll]').forEach(el => { el.scrollTop = el.scrollHeight; });
}
function renderSyncBadge() {
  const els = document.querySelectorAll('[data-sync-badge]');
  const color = state.syncStatus === 'online' ? 'online' : state.syncStatus === 'connecting' ? 'connecting' : 'offline';
  const text = state.syncStatus === 'online' ? 'synced' : state.syncStatus === 'connecting' ? 'syncing' : 'offline';
  els.forEach(el => { el.innerHTML = `<span class="dot ${color}"></span>${escapeHtml(text)}`; });
}

function renderProgressRing(completed, total, size = 68, stroke = 6, showLabel = true) {
  const pct = total === 0 ? 0 : Math.min(100, Math.round((completed / total) * 100));
  const R = (size - stroke) / 2, C = 2 * Math.PI * R, off = (pct / 100) * C;
  const cx = size / 2, cy = size / 2;
  let ticks = '';
  const n = Math.min(total, 24);
  const r1 = R - stroke / 2 - 4.5, r2 = R - stroke / 2 - 1.5;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2;
    ticks += `<line x1="${(cx + Math.cos(a) * r1).toFixed(1)}" y1="${(cy + Math.sin(a) * r1).toFixed(1)}" x2="${(cx + Math.cos(a) * r2).toFixed(1)}" y2="${(cy + Math.sin(a) * r2).toFixed(1)}" stroke-width="2" stroke-linecap="round" style="stroke:${i < completed ? 'var(--pine)' : 'var(--ring-tick)'}"/>`;
  }
  const big = size >= 90;
  return `<span class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke-width="${stroke}" style="stroke:var(--ring-track)"/>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${off.toFixed(1)} ${(C - off).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})" style="stroke:var(--pine);transition:stroke-dasharray .8s var(--ease)"/>
      ${ticks}
    </svg>
    ${showLabel ? `<span class="ring-label">
      <span class="ring-pct" style="font-size:${big ? 22 : 13}px">${pct}%</span>
      ${big ? `<span class="ring-sub">${completed}/${total}</span>` : ''}
    </span>` : ''}
  </span>`;
}

function renderTimeline(c, interactive) {
  return `<div class="timeline"><div class="tl-line"></div>

    const n = i + 1, done = n <= c.completed, next = n === c.completed + 1;
    const log = (c.logs || []).find(l => l.idx === n);
    return `<div class="timeline-item">
      <div class="timeline-dot ${done ? 'done' : next ? 'next' : ''}">${done ? I.check : n}</div>
      <div class="timeline-card ${done ? 'done' : next ? 'next' : ''}">
        <div style="min-width:0;flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="tl-title">Session ${n}</span>
            <span class="tag ${done ? 'tag-done' : next ? 'tag-next' : 'tag-upcoming'}">${done ? 'done' : next ? 'next' : 'upcoming'}</span>
          </div>
          <div class="tl-sub">${log ? `${escapeHtml(log.dateStr)} · checked in` : next ? 'Ready to check in' : 'Scheduled'}</div>
        </div>
        ${interactive && next ? `<button onclick="markSessionDone('${c.id}')" class="btn btn-gold btn-sm">Mark done</button>` :
          interactive && done && n === c.completed ? `<div style="display:flex;gap:8px;align-items:center"><span class="tsTxt">${log ? fmtTime(log.ts) : ''}</span><button onclick="undoLastSession('${c.id}')" class="btn btn-ghost btn-xs">Undo</button></div>` :
          done ? `<span class="tsTxt">${log ? fmtTime(log.ts) : '✓'}</span>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ============================
// MODALS
// ============================
function renderModals() {
  let h = '';
  if (state.showSettings) h += settingsModalHtml();
  if (state.showAddEditModal) h += addEditModalHtml();
  if (state.showShareModal) h += shareModalHtml();
  if (state.showRenewModal) h += renewModalHtml();
  if (state.showDeleteConfirm) h += deleteModalHtml();
  if (state.showResetConfirm) h += resetModalHtml();
  if (state.showClientChat && state.clientViewId) h += clientChatModalHtml();
  return h;
}
function overlayClick(e) { if (e.target === e.currentTarget) closeAllModals(); }
function closeAllModals() {
  state.showSettings = false;
  state.showAddEditModal = false;
  state.showShareModal = false;
  state.showRenewModal = false;
  state.showDeleteConfirm = null;
  state.showResetConfirm = false;
  state.showClientChat = false;
  state.draft = null;
  state.editingClient = null;
  state.sharingClient = null;
  state.renewingClient = null;
  state.renewDraft = null;
  rerender();
}

// ============================
// ACTIONS
// ============================
function switchTab(tab) { state.activeTab = tab; window.scrollTo({ top: 0 }); rerender(); }
function updateSearch(v) { state.searchQuery = v; rerender(); }
function clearSearch() { state.searchQuery = ''; rerender(); const el = document.getElementById('searchInput'); if (el) el.focus(); }

// Instructor preview: opens the SAME locked client view, but in a new tab
// so the instructor's workspace tab is never replaced.
function viewClient(id) { window.open(getShareLink(id), '_blank'); }
function openClientLink(id) { window.open(getShareLink(id), '_blank'); }

// Instructor: tracker detail navigation
function selectClient(id) { state.selectedClientId = id; state.showHistory = false; window.scrollTo({ top: 0 }); rerender(); }
function deselectClient() { state.selectedClientId = null; rerender(); }

// Client-side chat (modal)
function sendClientMessage() {
  const c = getClientById(state.clientViewId);
  if (!c) return;
  const el = document.getElementById('clientChatInput');
  const txt = (el ? el.value : '').trim();
  if (!txt) return;
  c.messages = c.messages || [];
  c.messages.push({ id: generateId(), from: 'client', text: txt, ts: Date.now(), type: 'message' });
  commit(); // re-renders; modal stays open, focus + caret restored
  const el2 = document.getElementById('clientChatInput');
  if (el2) el2.focus();
}
function sendProgramRequest(program) {
  const c = getClientById(state.clientViewId);
  if (!c) return;
  c.messages = c.messages || [];
  c.messages.push({ id: generateId(), from: 'client', text: "I'd like to switch my program to " + program, ts: Date.now(), type: 'program_request' });
  c.programRequest = program;
  commit();
  showToast('Request sent to your coach', 'ok');
  const el = document.getElementById('clientChatInput');
  if (el) el.focus();
}

function initTheme() {
  let t = null;
  try { t = localStorage.getItem('traka_theme'); } catch (e) {}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  try { localStorage.setItem('traka_theme', state.theme); } catch (e) {}
  rerender();
}
function toggleSettings() { state.showSettings = !state.showSettings; rerender(); }

// ---- add / edit ----
function openAddModal() {
  state.editingClient = null;
  state.draft = { name: '', gender: 'Female', program: programs[0], total: 12, completed: 0, fee: '', paymentStatus: 'Unpaid', note: '', schedule: [{ day: 'Mon', time: '08:00' }] };
  state.showAddEditModal = true;
  rerender();
  const el = document.getElementById('d_name'); if (el) el.focus();
}
function openEditModal(id) {
  const c = getClientById(id);
  if (!c) return;
  state.editingClient = id;
  state.draft = {
    name: c.name, gender: c.gender, program: c.program, total: c.total, completed: c.completed,
    fee: c.fee, paymentStatus: c.paymentStatus, note: c.note,
    schedule: c.schedule.length ? c.schedule.map(s => ({ day: s.day, time: s.time })) : [{ day: 'Mon', time: '08:00' }]
  };
  state.showAddEditModal = true;
  rerender();
  const el = document.getElementById('d_name'); if (el) el.focus();
}
function setDraft(k, v) { if (state.draft) state.draft[k] = v; }
function setDraftNum(k, v) { if (state.draft) state.draft[k] = Math.max(0, parseInt(v, 10) || 0); }
function setSched(i, k, v) { if (state.draft && state.draft.schedule[i]) state.draft.schedule[i][k] = v; }
function addSchedRow() { if (state.draft) { state.draft.schedule.push({ day: 'Mon', time: '08:00' }); rerender(); } }
function removeSchedRow(i) { if (state.draft) { state.draft.schedule.splice(i, 1); rerender(); } }
function saveClient() {
  if(state.draft && state.draft.program) ensureCustomProgram(state.draft.program);
  const d = state.draft;
  if (!d) return;
  const name = (d.name || '').trim();
  if (!name) { showToast('Please enter a client name', 'warn'); const el = document.getElementById('d_name'); if (el) el.focus(); return; }
  const total = Math.max(1, parseInt(d.total, 10) || 1);
  const completed = Math.max(0, Math.min(parseInt(d.completed, 10) || 0, total));
  const schedule = (d.schedule || []).filter(s => s.day && s.time).map(s => ({ day: s.day, time: s.time }));
  if (state.editingClient) {
    const c = getClientById(state.editingClient);
    if (c) {
      Object.assign(c, { name, gender: d.gender, program: d.program, total, completed, schedule, fee: d.fee || '', paymentStatus: d.paymentStatus, note: d.note || '' });
      c.logs = (c.logs || []).filter(l => l.idx <= completed);
      showToast('Client updated', 'ok');
    }
  } else {
    state.clients.push(normalizeClient({
      id: generateId(), name, gender: d.gender, program: d.program, total, completed,
      schedule, createdAt: Date.now(), fee: d.fee, paymentStatus: d.paymentStatus, note: d.note
    }));
    showToast('Client added', 'ok');
  }
  state.showAddEditModal = false;
  state.draft = null;
  state.editingClient = null;
  commit();
}

// ---- sessions ----
function markSessionDone(id) {
  const c = getClientById(id);
  if (!c || c.completed >= c.total) return;
  c.completed += 1;
  const now = Date.now();
  c.logs = c.logs || [];
  c.logs.push({ idx: c.completed, ts: now, dateStr: new Date(now).toLocaleDateString() });
  if (c.completed === c.total) showToast(`${c.name} completed the subscription — time to renew`, 'ok');
  else showToast(`Session ${c.completed}/${c.total} done`, 'ok');
  commit();
}
function undoLastSession(id) {
  const c = getClientById(id);
  if (!c || c.completed <= 0) return;
  c.logs = (c.logs || []).filter(l => l.idx !== c.completed);
  c.completed -= 1;
  showToast('Last session undone', 'warn');
  commit();
}

// ---- status ----
function setClientStatus(id, status) {
  const c = getClientById(id);
  if (!c || c.status === status) return;
  c.status = status;
  if (status === 'paused') c.pausedAt = Date.now();
  if (status === 'cancelled') c.cancelledAt = Date.now();
  if (status === 'active') { c.pausedAt = null; c.cancelledAt = null; }
  const verbs = { active: 'restarted', paused: 'paused', cancelled: 'cancelled', archived: 'archived' };
  showToast(`${c.name} ${verbs[status] || status}`, status === 'cancelled' ? 'warn' : 'ok');
  commit();
}
function archiveClient(id) { setClientStatus(id, 'archived'); }

// ---- share ----
function showShareModal(id) { state.sharingClient = id; state.showShareModal = true; rerender(); }
function copyShareLink() {
  const c = getClientById(state.sharingClient);
  if (!c) return;
  copyText(getShareLink(c.id)).then(ok =>
    showToast(ok ? 'Link copied to clipboard' : 'Copy failed — select it manually', ok ? 'ok' : 'warn'));
}

// ---- renew ----
function showRenewModal(id, prefillProgram) {
  const c = getClientById(id);
  if (!c) return;
  state.renewingClient = id;
  state.renewDraft = { program: prefillProgram || c.programRequest || c.program, total: 10, fee: c.fee || '' };
  state.showRenewModal = true;
  rerender();
}
function setRenewDraft(k, v) { if (state.renewDraft) state.renewDraft[k] = v; }
function setRenewDraftNum(k, v) { if (state.renewDraft) state.renewDraft[k] = Math.max(1, parseInt(v, 10) || 1); }
function renewClient() {
  if(state.renewDraft && state.renewDraft.program) ensureCustomProgram(state.renewDraft.program);
  const c = getClientById(state.renewingClient);
  const d = state.renewDraft;
  if (!c || !d) return;
  const total = Math.max(1, parseInt(d.total, 10) || 1);
  c.history = c.history || [];
  c.history.push({
    id: 'h_' + generateId(),
    programName: c.program, totalSessions: c.total, completedSessions: c.completed,
    startDate: (c.logs && c.logs.length) ? c.logs[0].ts : c.createdAt,
    endDate: Date.now(), completedAt: new Date().toISOString(),
    schedule: c.schedule.map(s => ({ day: s.day, time: s.time }))
  });
  Object.assign(c, {
    program: d.program, total, completed: 0, logs: [], fee: d.fee || '',
    paymentStatus: 'Unpaid', status: 'active', programRequest: '', pausedAt: null, cancelledAt: null
  });
  state.showRenewModal = false;
  state.renewingClient = null;
  state.renewDraft = null;
  state.activeTab = 'TRACKER';
  state.selectedClientId = c.id;
  commit();
  showToast('Subscription renewed — new cycle started', 'ok');
}

// ---- delete / reset ----
function showDeleteConfirm(id) { state.showDeleteConfirm = id; rerender(); }
function deleteClient() {
  const id = state.showDeleteConfirm;
  state.clients = getClients().filter(c => c.id !== id);
  if (state.selectedClientId === id) state.selectedClientId = null;
  if (state.selectedMessageClientId === id) state.selectedMessageClientId = null;
  state.showDeleteConfirm = null;
  commit();
  showToast('Client deleted', 'warn');
}
function showResetConfirm() { state.showSettings = false; state.showResetConfirm = true; rerender(); }
function resetData() {
  state.clients = []; // factory reset - clean slate
  closeAllModals();
  commit();
  showToast('Workspace reset - all data cleared', 'warn');
}
function exportData() {
  const blob = new Blob([JSON.stringify(getClients(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'traka-clients-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Backup exported', 'ok');
}
function triggerImport() {
  const inp = document.getElementById('importFileInput');
  if (inp) inp.click();
}
function importData(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      let incoming = [];
      if (Array.isArray(parsed)) incoming = parsed;
      else if (parsed && typeof parsed === 'object') {
        if (Array.isArray(parsed.clients)) incoming = parsed.clients;
        else incoming = Object.values(parsed);
      }
      incoming = incoming.map(normalizeClient).filter(Boolean);
      if (incoming.length === 0 && getClients().length > 0) {
        if (!confirm('Backup appears empty or invalid. This would clear all clients. Continue?')) { event.target.value=''; return; }
      }
      state.clients = incoming;
      commit();
      showToast('Backup restored - ' + incoming.length + ' clients loaded', 'ok');
    } catch (err) {
      showToast('Import failed: ' + err.message, 'error');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

// ---- misc ----
function selectMessageClient(id) { state.selectedMessageClientId = id; window.scrollTo({ top: 0 }); rerender(); }
function deselectMessageClient() { state.selectedMessageClientId = null; rerender(); }
function toggleHistory() { state.showHistory = !state.showHistory; rerender(); }
function sendInstructorMessage(id) {
  const c = getClientById(id);
  if (!c) return;
  const el = document.getElementById('chatIn_' + id);
  const txt = (el ? el.value : '').trim();
  if (!txt) return;
  c.messages = c.messages || [];
  c.messages.push({ id: generateId(), from: 'instructor', text: txt, ts: Date.now(), type: 'message' });
  commit();
  const el2 = document.getElementById('chatIn_' + id);
  if (el2) el2.focus();
}

// ============================
// BOOT
// ============================
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const any = state.showSettings || state.showAddEditModal || state.showShareModal ||
                state.showRenewModal || state.showDeleteConfirm || state.showResetConfirm ||
                state.showClientChat;
    if (any) closeAllModals();
  }
});
window.addEventListener('online', () => { if (dirty) pushToFirebase(); else pullFromFirebase(); });
window.addEventListener('offline', () => { state.syncStatus = 'offline'; renderSyncBadge(); });
initTheme();
initData();
